{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apagar produto</title>
    <link rel="stylesheet" href="{% static 'produtos/style.css' %}">
</head>
<body>
    <h1>🗑️ Deletar Produto</h1>

    <p>Tem certeza que deseja apagar <strong>{{ produto.nome }}</strong>?</p>
    <p>essa ação não podera ser desfeita!</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-perigo" type="submit">Sim, apagar</button>
        <a class="btn" href="{% url 'listar_produtos' %}">Cancelar</a>
    </form>



</body>
</html>
