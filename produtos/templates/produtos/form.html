{%extends "produtos/base.html"%}

{% block titulo%}Editar produto{% endblock %}

{% block conteudo %}

    <form method="post">
        {% csrf_token%}
        {{form.as_p}}
        <button type="submit" class="btn">Salvar</button>

    <p><a class="btn" href="{% url 'listar_produtos'%}">← Voltar para a lista</a></p>

{%endblock%}
